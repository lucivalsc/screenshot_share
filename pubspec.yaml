name: screenshot_share_telegram
description: A Flutter package for capturing screenshots and sharing them as a single ZIP archive, saved locally or handed to the native share sheet.
version: 0.2.0
homepage: https://github.com/lucivalsc/screenshot_share.git

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.6.0
  image: ^4.12.0
  path_provider: ^2.1.1
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  # This package ships no assets or fonts; it is pure Dart plus the
  # dependencies declared above.
